<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pecsil Moldes — Controle de Fundos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO: logo, título e setor -->
  <header class="cabecalho">
    <div class="container-topo">
      <div class="bloco-titulo">
        <div class="logo-box">
          <img src="logo_pecsil.jpg" alt="Logo Pecsil Moldes" class="logo-pecsil">
        </div>
        <h1>Pecsil Moldes — Controle de Fundos</h1>
        <span class="etiqueta-setor">QUALIDADE</span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main>

    <!-- RESUMO: 3 cards -->
    <section class="resumo">
      <div class="card">
        <h3>Peças no Cliente</h3>
        <div class="valor" id="resumo-total">6</div> <!-- placeholder: o JS atualiza via #resumo-total -->
      </div>

      <div class="card">
        <h3>Próx. Forma</h3>
        <div class="valor" id="resumo-forma">Nº 2</div> <!-- placeholder: o JS atualiza via #resumo-forma -->
      </div>

      <div class="card">
        <h3>Próx. Bloco</h3>
        <div class="valor" id="resumo-bloco">Nº 3</div> <!-- placeholder: o JS atualiza via #resumo-bloco -->
      </div>
    </section>

    <!-- ABAS DE CLIENTES -->
    <nav class="barra-abas">

      <!-- #abas: o JS desenha uma aba por cliente aqui dentro.
           As 2 abas abaixo são fixas, só de exemplo para o CSS estilizar. -->
      <div id="abas" class="abas">
        <button class="aba aba-ativa" type="button"> <!-- aba-ativa = aba selecionada -->
          Cliente Exemplo A <span class="contador">3</span> <!-- contador = nº de peças do cliente -->
        </button>
        <button class="aba" type="button">
          Cliente Exemplo B <span class="contador">1</span>
        </button>
      </div>

      <!-- Botão para cadastrar novo cliente (o JS vai tratar o clique via #btn-novo-cliente) -->
      <button id="btn-novo-cliente" class="btn-novo-cliente" type="button">
        + Novo Cliente
      </button>

    </nav>

    <!-- BUSCA: campo de texto + toggle de escopo -->
    <section class="barra-busca">

      <!-- #busca: o JS lê o valor digitado para filtrar as peças -->
      <input
        id="busca"
        class="busca"
        type="text"
        placeholder="Buscar por ART (ex: 1514, TG, DG), revisão (R1) ou nº..."
      >

      <!-- #toggle-escopo: define onde a busca vale (cliente da aba ou todos).
           O JS troca a classe toggle-ativo ao clicar. -->
      <div id="toggle-escopo" class="toggle-escopo">
        <button class="toggle-btn toggle-ativo" type="button">Cliente Atual</button>
        <button class="toggle-btn" type="button">Todos os Clientes</button>
      </div>

    </section>

    <!-- aqui entra a lista/tabela de peças -->

  </main>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <div class="rodape-conteudo">
      
      <!-- Linha 1: E-mail, Telefone e Ícones Sociais -->
      <div class="rodape-contato">
        <span>
          <strong>Email:</strong> 
          <a href="mailto:qualidadepecsil@pecsil.com.br">qualidadepecsil@pecsil.com.br</a>
        </span>

        <span class="separador">|</span>

        <span>
          <strong>Telefone:</strong> 
          <a href="tel:+551140134870">(11) 4013-4870</a>
        </span>

        <span class="separador">|</span>

      
        <div class="rodape-redes">
          <a href="#" target="_blank" aria-label="Instagram Pecsil Moldes" title="Instagram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>

          <a href="#" target="_blank" aria-label="WhatsApp Pecsil Moldes" title="WhatsApp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </a>
        </div>
      </div>

      
      <p class="rodape-endereco">
        Rua Francisco Faria, 243, Itu, São Paulo, 13313-531
      </p>

    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
